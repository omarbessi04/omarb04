<header class="site-nav">
  <div class="shell nav-inner">
    <a class="brand" href="{{ url_for('home') }}">Omar Bessi</a>

    <nav class="nav-links" aria-label="Main">
      <a class="nav-link{% if request.endpoint == 'job_history' %} active{% endif %}"
         href="{{ url_for('job_history') }}"{% if request.endpoint == 'job_history' %} aria-current="page"{% endif %}>Experience</a>
      <a class="nav-link{% if request.endpoint == 'projects' or (request.endpoint or '').startswith('amoki') %} active{% endif %}"
         href="{{ url_for('projects') }}"{% if request.endpoint == 'projects' %} aria-current="page"{% endif %}>Projects</a>
      <a class="nav-link{% if request.endpoint == 'contact' %} active{% endif %}"
         href="{{ url_for('contact') }}"{% if request.endpoint == 'contact' %} aria-current="page"{% endif %}>Contact</a>
    </nav>

    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark theme">
      <span class="theme-icon theme-icon-sun" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.2"></circle>
          <path d="M12 2.6v2.3M12 19.1v2.3M21.4 12h-2.3M4.9 12H2.6M18.6 5.4l-1.6 1.6M7 17l-1.6 1.6M18.6 18.6L17 17M7 7L5.4 5.4"></path>
        </svg>
      </span>
      <span class="theme-icon theme-icon-moon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.2 14.2A8.4 8.4 0 0 1 9.8 3.8a8.4 8.4 0 1 0 10.4 10.4z"></path>
        </svg>
      </span>
    </button>
  </div>
</header>
