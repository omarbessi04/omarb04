{# Small inline icons. Each is aria-hidden: the link text already says where it
   goes, so the mark is decoration on top of a label, not the label itself. #}

{% macro ext() -%}
<svg class="ext" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.2 10.8 10.8 5.2M6.1 5.2h4.7v4.7"/></svg>
{%- endmacro %}

{% macro chev() -%}
<svg class="ext" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>
{%- endmacro %}
